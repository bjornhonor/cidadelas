[project]
name = "cidadelas"
version = "0.1.0"
description = "Coleta e cálculo dos indicadores dos municípios de SP"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "scipy>=1.13",
    "python-calamine>=0.2",  # planilhas grandes da SSP (openpyxl leva minutos)
    "osmium>=3.7",  # ruas e bairros do OpenStreetMap (vias, cidade)
    "scikit-learn>=1.3",  # k-means dos setores censitários (rotas, cidade)
    "r5py>=1.0",  # tempos de carro; precisa de Java 21 (rotas, deslocamento, cidade)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cidadelas*"]
