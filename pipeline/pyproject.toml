[project]
name = "cidadelas"
version = "0.1.0"
description = "Coleta e cálculo dos indicadores dos municípios de SP"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "scipy>=1.13",
    "python-calamine>=0.2",  # planilhas grandes da SSP (openpyxl leva minutos)
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cidadelas*"]
